openapi: '3.0.3'
info:
  title: API Title
  version: '1.0'
servers:
  - url: https://localhost:3000/v1
paths:
  /health:
    get:
      summary: Check the health status of the server
      responses:
        '200':
          description: OK
        '505':
          description: server unreachable
  
  /recipes/recipeOfTheDay:
    get:
      summary: Get the recipe of the day
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                items: 
                  $ref: '#/components/schemas/Recipe'
        '505':
          description: server unreachable
          
components:
  schemas:
    Recipe:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        instructions:
          type: string
        ingridiants:
          type: array
          items:
            type: string
        measure:
          type: array
          items:
            type: string
        thumnail:
          type: string