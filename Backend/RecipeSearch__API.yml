openapi: '3.0.3'
info:
  title: API Title
  version: '1.0'
servers:
  - url: https://localhost:3000/v1

paths:
  /health:
    get:
      summary: Check the health status of the server
      responses:
        '200':
          description: OK
  
  /recipes/recipeOfTheDay:
    get:
      summary: Get the recipe of the day
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                items: 
                  $ref: '#/components/schemas/Recipe'
        '503':
          description: service unavailable

  /recipe?search={recipeName}:
    get:
      summary: Get all recipes for a certain keyword
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                    $ref: '#/components/schemas/Recipe'
        '400':
          description: empty/invalid search parameter
        '404':
          description: recipe not found
        '503':
          description: service unavailable

components:
  schemas:
    Recipe:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        instructions:
          type: string
        ingridiants:
          type: array
          items:
            type: string
        measure:
          type: array
          items:
            type: string
        thumnail:
          type: string